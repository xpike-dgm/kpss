             - Yardım/Geri Bildirim Merkezi
             - Kaydedilenler/favoriler ve level 100 sonrası açık karar

          28. ⬜ **Data Retention / Compliance / Release Acceptance Criteria**
             - Veri saklama/silme süreleri
             - KVKK/compliance çıkış kapısı
             - Felaket kurtarma ve güvenlik release koşulları
             - “Ürün hazır” kabul kriterleri
          """.replace("          ", "")
          roadmap = roadmap.replace(insert_marker, extra + insert_marker, 1)

          roadmap = replace_once(
              roadmap,
              "Ana ürün planlama yol haritasındaki 21 ana başlığın tamamı ✅ durumundadır. Bundan sonraki çalışmalar UI/UX, denge, içerik operasyonu ve uygulama ayrıntılarını netleştirecektir.",
              "İlk 21 ana başlık tamamlandıktan sonra yapılan gap analysis ile post-audit planlama turu açılmıştır. Şu anda aktif tartışma konusu: **23. KPSS Sınav Modeli / Müfredat / Güncel Bilgiler / Puan Türleri 🟨**.",
              "roadmap active footer",
          )

          product_path.write_text(product, encoding="utf-8")
          roadmap_path.write_text(roadmap, encoding="utf-8")

      - name: Validate stale phrases are gone
        shell: python
        run: |
          from pathlib import Path
          p = Path("PRODUCT_PLAN.md").read_text(encoding="utf-8")
          r = Path("DISCUSSION_ROADMAP.md").read_text(encoding="utf-8")
          forbidden = [
              "Dashboard ve oyunlaştırma yönü — kısmen kararlaştırıldı",
              "Günlük çalışma sistemi — kısmen kararlaştırıldı",
              "Hedef puan, günlük çalışma süresi, önceki KPSS deneyimi ve çalışma aşaması gibi ek sorular ileride değerlendirilebilir; henüz kesin değildir.",
              "Soru zorluk puanının kesin hesaplama yöntemi henüz tamamlanmamıştır.",
              "Tam DM sistemi kullanılacaksa",
              "İlk sürümde ayrı bir coin/mağaza",
              "İlk sürüm avatar sistemi",
              "mümkünse transcript",
          ]
          for phrase in forbidden:
              if phrase in p:
                  raise SystemExit(f"stale PRODUCT_PLAN phrase remains: {phrase}")
          if "tam DM varsa" in r or "İlk sürümde coin/mağaza yok" in r or "mümkünse transcript" in r:
              raise SystemExit("stale roadmap phrase remains")
          if "23. 🟨 **KPSS Sınav Modeli" not in r:
              raise SystemExit("topic 23 not activated")

