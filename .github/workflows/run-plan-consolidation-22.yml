name: Run accepted plan consolidation 22

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-plan-consolidation-22.yml

permissions:
  contents: write

jobs:
  run-consolidation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consolidation branch
        uses: actions/checkout@v4
        with:
          ref: plan/consolidation-22
          fetch-depth: 0

      - name: Extract and run accepted consolidation script
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/consolidate-plan-22.yml').read_text(encoding='utf-8').splitlines()
          start = None
          for i, line in enumerate(workflow):
              if line.strip() == '- name: Apply accepted consolidation decisions':
                  for j in range(i + 1, len(workflow)):
                      if workflow[j].strip() == 'run: |':
                          start = j + 1
                          break
                  break
          if start is None:
              raise SystemExit('consolidation script block not found')

          code = []
          for line in workflow[start:]:
              if line.startswith('      - name:'):
                  break
              if line.startswith('          '):
                  code.append(line[10:])
              elif not line.strip():
                  code.append('')
              else:
                  raise SystemExit(f'unexpected indentation in embedded script: {line!r}')

          Path('/tmp/consolidate_plan22.py').write_text('\n'.join(code) + '\n', encoding='utf-8')
          subprocess.run(['python', '/tmp/consolidate_plan22.py'], check=True)

      - name: Validate accepted cleanup
        shell: python
        run: |
          from pathlib import Path
          p = Path('PRODUCT_PLAN.md').read_text(encoding='utf-8')
          r = Path('DISCUSSION_ROADMAP.md').read_text(encoding='utf-8')
          checks = {
            'dashboard stale': 'Dashboard ve oyunlaştırma yönü — kısmen kararlaştırıldı' not in p,
            'daily stale': 'Günlük çalışma sistemi — kısmen kararlaştırıldı' not in p,
            'old target undecided': 'Hedef puan, günlük çalışma süresi, önceki KPSS deneyimi ve çalışma aşaması gibi ek sorular ileride değerlendirilebilir; henüz kesin değildir.' not in p,
            'old difficulty undecided': 'Soru zorluk puanının kesin hesaplama yöntemi henüz tamamlanmamıştır.' not in p,
            'full dm conditional': 'Tam DM sistemi kullanılacaksa' not in p,
            'transcript scraping stale': 'mümkünse transcript' not in p,
            'old coin first version': 'İlk sürümde ayrı bir coin/mağaza' not in p,
            'old avatar first version': 'İlk sürüm avatar sistemi' not in p,
            'topic 22 closed': '22. ✅ **PRODUCT_PLAN Konsolidasyonu ve Çelişki Temizliği**' in r,
            'topic 23 active': '23. 🟨 **KPSS Sınav Modeli / Müfredat / Güncel Bilgiler / Puan Türleri**' in r,
          }
          failed = [k for k, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('validation failed: ' + ', '.join(failed))

      - name: Commit branch result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/consolidate-plan-22.yml
          git add PRODUCT_PLAN.md DISCUSSION_ROADMAP.md
          git commit -m "Consolidate accepted product plan decisions"
          git push origin HEAD:plan/consolidation-22
